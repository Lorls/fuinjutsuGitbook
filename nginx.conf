server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Astro génère des pages en /chemin/index.html (URLs avec slash final)
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
    }

    # Page 404 de Starlight
    error_page 404 /404.html;

    # Cache long pour les assets à hash (immuables)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
