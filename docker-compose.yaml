services:
  app:
    build: .
    ports:
      - "4321:4321"
    environment:
      DATABASE_URL: "file:/data/fuinjutsu.db"
      SESSION_SECRET: "${SESSION_SECRET:-dev-secret-change-me}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-change-me}"
    volumes:
      - fuinjutsu-data:/data
    restart: unless-stopped

volumes:
  fuinjutsu-data:
